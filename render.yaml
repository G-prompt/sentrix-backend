services:
  - type: web
    name: sentrix-backend
    runtime: node
    plan: free
    buildCommand: yarn install || npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_MOCK_DATA
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: sentrix_db
          property: connectionString
      - key: INTERSWITCH_API_KEY
        sync: false
      - key: INTERSWITCH_API_SECRET
        sync: false
      - key: INTERSWITCH_API_URL
        sync: false

databases:
  - name: sentrix_db
    databaseName: sentrix
    user: sentrix_user
    plan: free
